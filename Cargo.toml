[package]
name = "maprisma-applet"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "COSMIC panel applet: start, stop and test Maprisma"

[[bin]]
name = "maprisma-control-tray"
path = "src/tray/main.rs"

[dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
libc = "0.2"
png = "0.18"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
# The revision COSMIC's own applets (cosmic-applets 1.11) are built against.
rev = "95236a944bfd51c63a2fc65fe50a592c47168d40"
default-features = false
features = ["applet", "applet-token", "dbus-config", "multi-window", "tokio", "wayland", "winit"]

[profile.release]
lto = "thin"
